stages:
  - build
  - test
  - deploy
  - destroy
   
variables:
  TF_DIR: "infrastructureautomation/terraform/host"
  ANSIBLE_DIR: "ansible"
  TF_VAR_region: "westeurope"
  PROJECT_REPO: "https://oauth2:${SWIFT_BY_TOKEN}@gitlab.com/kdg-ti/integration-4/2024-2025/team-8/biketrust.git"
  INFRA_REPO: "https://oauth2:glpat-WdzgyXSXHzrkn4Jyhuet@gitlab.com/kdg-ti/integration-4/2024-2025/team-8/infrastructureautomation.git"
 
cache:
  paths:
    - .gradle/wrapper
    - .gradle/caches

build:
  stage: build
  image: gradle:jdk21
  script:
   - ./gradlew --build-cache assemble
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "development"'
      when: always
    - when: never


test:
  stage: test
  image: gradle:jdk21
  services:
  - name: postgres:17.2-alpine 
  variables:
    POSTGRES_DB: 'swiftby_testdb'
    POSTGRES_USER: 'admin'
    POSTGRES_PASSWORD: 'admin'
    CI_DB_HOST_PORT: 'postgres:5432'
    SPRING_PROFILES_ACTIVE: test
  script:
    - echo "Injecting env file"
    - cat "$TEST_ENV_FILE"
    - cp "$TEST_ENV_FILE" .env
    - cat .env 
    - ./gradlew test
  artifacts:
    reports:
      junit: build/test-results/test/TEST-*.xml
  rules:
  - if: '$CI_COMMIT_BRANCH == "main"'
    when: always
  - if: '$CI_COMMIT_BRANCH == "development"'
    when: always
  - when: never

    
deploy:
  stage: deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl jq bash git openssh tar python3 py3-pip ansible
    - cp "$AZURE_CREDENTIALS" creds.json
    - export ARM_CLIENT_ID=$(jq -r .clientId creds.json)
    - export ARM_CLIENT_SECRET=$(jq -r .clientSecret creds.json)
    - export ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId creds.json)
    - export ARM_TENANT_ID=$(jq -r .tenantId creds.json)
    - export TF_VAR_subscription_id=$ARM_SUBSCRIPTION_ID
    - export TF_VAR_client_id=$ARM_CLIENT_ID
    - export TF_VAR_client_secret=$ARM_CLIENT_SECRET
    - export TF_VAR_tenant_id=$ARM_TENANT_ID
    - export ANSIBLE_HOST_KEY_CHECKING=False
  script:
    - echo "Injecting .env for production"
    - cp "$TEST_ENV_FILE" .env
    - export SPRING_PROFILES_ACTIVE=prod
    - echo "testie test"
    - pwd 
    - ls
    - git clone "$INFRA_REPO" infrastructureautomation
    - cd "$TF_DIR"
    - curl -sL https://github.com/opentofu/opentofu/releases/download/v1.6.0/tofu_1.6.0_linux_amd64.zip -o tofu.zip
    - unzip tofu.zip -d tofu-bin && mv tofu-bin/tofu /usr/local/bin/
    - chmod +x /usr/local/bin/tofu
    - ssh-keygen -t rsa -b 2048 -f id_rsa -q -N ""
    - chmod 600 id_rsa
    - cp id_rsa ../../id_rsa
    - export TF_VAR_public_key="$(cat id_rsa.pub)"
    - tofu init
    - tofu apply -auto-approve


    - tofu init
    - tofu apply -auto-approve
      
    - echo "VM_IP=$(tofu output -raw vm_public_ip)" >> $CI_PROJECT_DIR/deployment.env
    - echo "VM_USERNAME=$(tofu output -raw vm_username)" >> $CI_PROJECT_DIR/deployment.env

    - cd ../../ansible
    - ansible-playbook -i inventory.ini playbook.yml
 
 
  artifacts:
    reports:
      dotenv: deployment.env
    paths:
      - infrastructureautomation/terraform/host/id_rsa
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
   
destroy:
  stage: destroy
  image: alpine:3.18
  when: manual
  allow_failure: true
  needs: []
  before_script:
    - apk add --no-cache curl jq git bash tar
    - cp "$AZURE_CREDENTIALS" creds.json
    - export ARM_CLIENT_ID=$(jq -r .clientId creds.json)
    - export ARM_CLIENT_SECRET=$(jq -r .clientSecret creds.json)
    - export ARM_SUBSCRIPTION_ID=$(jq -r .subscriptionId creds.json)
    - export ARM_TENANT_ID=$(jq -r .tenantId creds.json)
    - export TF_VAR_subscription_id=$ARM_SUBSCRIPTION_ID
    - export TF_VAR_client_id=$ARM_CLIENT_ID
    - export TF_VAR_client_secret=$ARM_CLIENT_SECRET
    - export TF_VAR_tenant_id=$ARM_TENANT_ID
  script:
    - git clone "$INFRA_REPO" infrastructureautomation
    - cd "$TF_DIR"
    - curl -sL https://github.com/opentofu/opentofu/releases/download/v1.6.0/tofu_1.6.0_linux_amd64.zip -o tofu.zip
    - unzip tofu.zip -d tofu-bin && mv tofu-bin/tofu /usr/local/bin/
    - chmod +x /usr/local/bin/tofu
    - tofu init
    - tofu destroy -auto-approve || echo "Nothing to destroy"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never