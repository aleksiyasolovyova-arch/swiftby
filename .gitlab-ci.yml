stages:
  - build
  - test
  - deploy
  - destroy

variables:
  VM_IP: "51.124.189.117"      # Your VM's public IP
  VM_USER: "mj"                # Your VM's username
  SSH_PORT: 22

build-job:
  stage: build
  image: gradle:jdk21
  script:
    - ./gradlew build

unit-test-job:
  stage: test
  image: gradle:jdk21
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: builds/test-results/test/*.xml

deploy-job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash rsync
    # Set up SSH key from GitLab CI/CD variable
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan -p $SSH_PORT $VM_IP >> ~/.ssh/known_hosts
  script:
    - rsync -az --exclude=.git --exclude=build --delete -e "ssh -p $SSH_PORT" . $VM_USER@$VM_IP:~/app/
    - ssh -p $SSH_PORT $VM_USER@$VM_IP "cd ~/biketrust && bash scripts/deploy.sh"
  only:
    - development


destroy-job:
  stage: destroy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p $SSH_PORT $VM_IP >> ~/.ssh/known_hosts
  script:
    - ssh -p $SSH_PORT $VM_USER@$VM_IP "cd ~/biketrust && bash scripts/destroy.sh"
  when: manual
  only:
    - development

smoke-test-job:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - |
      echo "Running smoke test..."
      STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://swiftby.be)
      if [ "$STATUS" -eq 200 ]; then
        echo "Smoke test passed: App is up!"
      else
        echo "Smoke test failed: App returned HTTP $STATUS"
        exit 1
      fi
  needs: ["deploy-job"]
  only:
    - development
  