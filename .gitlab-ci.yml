stages:
  - build
  - test
  - deploy
  - destroy

variables:
  VM_IP: "51.124.189.117"      # Your VM's public IP
  VM_USER: "mj"                # Your VM's username
  SSH_PORT: 22

build-job:
  stage: build
  image: gradle:jdk21
  script:
    - ./gradlew build

unit-test-job:
  stage: test
  image: gradle:jdk21
  script:
    - ./gradlew test
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/*.xml

deploy-job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash rsync
    # Setup SSH key from GitLab CI/CD variable
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p $SSH_PORT $VM_IP >> ~/.ssh/known_hosts
  script:
    # Copy project files to VM (adjust path as needed)
    - rsync -az --exclude=.git --exclude=build --delete -e "ssh -p $SSH_PORT" . $VM_USER@$VM_IP:~/app/
    # Optionally run deployment script on VM
    - ssh -p $SSH_PORT $VM_USER@$VM_IP "cd ~/biketrust && bash scripts/deploy.sh"
  only:
    - main

destroy-job:
  stage: destroy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p $SSH_PORT $VM_IP >> ~/.ssh/known_hosts
  script:
    - ssh -p $SSH_PORT $VM_USER@$VM_IP "cd ~/biketrust && bash scripts/destroy.sh"
  when: manual
  only:
    - main