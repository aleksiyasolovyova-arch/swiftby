<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <link rel="stylesheet" th:href="@{../static/css/headerStyle.css}">
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <title>header</title>
</head>
<body>
<header th:fragment="header(currentPage)">
    <div class="navbar navbar-expand-lg">
        <div class="logo">
            <a class="navbar-brand" href="/">SwiftBy</a>
        </div>
        <nav>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Feature</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/">User Examples</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/">Resources</a>
                </li>
                <li class="nav-item me-2 pt-2" sec:authorize="isAuthenticated()">
                    <span class="navbar-text">Welcome, <span sec:authentication="name"></span>!</span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form class="d-flex" th:action="@{/logout}" th:method="POST">
                        <button type="submit" class="btn btn-secondary">Logout</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link"
                       th:href="@{/login}"
                       th:classappend="${currentPage == 'login' ? 'active' : ''}"
                       th:attrappend="aria-current=${currentPage == 'login' ? 'page' : null}">Login</a>
                </li>
            </ul>
        </nav>
    </div>
</header>
</body>
</html>
