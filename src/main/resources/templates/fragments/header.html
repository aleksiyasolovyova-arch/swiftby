<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <title>header</title>
    <link rel="icon" href="/images/bicycle.svg">

</head>
<body>
<header th:fragment="header(currentPage)" class="navbar navbar-expand-lg py-3" style="background-color: #344a57;">
    <div class="container-fluid">
        <a class="navbar-brand text-light fw-bold" th:href="@{/}">
            <i class="bi bi-house"></i>
            <span>eVALeBike</span>
        </a>
        <button class="navbar-toggler text-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link text-light" th:href="@{/bikeowner/bikes}"
                       sec:authorize="hasRole('ROLE_BIKEOWNER')">My Bikes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" th:href="@{/bikeowner/bike-reports}"
                       sec:authorize="hasRole('ROLE_BIKEOWNER')">My Bike Reports</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" th:href="@{/technician/dashboard}"
                       sec:authorize="hasAnyRole('ROLE_TECHNICIAN')">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a th:if="${session.get('facilityId') != null}"
                       th:href="@{/facility/{id}/overview(id=${session.get('facilityId')})}"
                       class="nav-link text-light"
                       sec:authorize="hasAnyRole('ROLE_ADMINISTRATOR')">
                        Facility overview
                    </a>
                </li>
                <!--                <li class="nav-item">-->
                <!--                    <a class="nav-link text-light" th:href="@{/workInProgress}" sec:authorize="hasAnyRole('ROLE_ADMINISTRATOR', 'ROLE_SUPERADMIN')">Customers</a>-->
                <!--                </li>-->
                <li class="nav-item">
                    <a class="nav-link text-light" th:href="@{/bikes}"
                       sec:authorize="hasAnyRole('ROLE_TECHNICIAN', 'ROLE_SUPERADMIN')">All Bikes</a>
                </li>
                <!--                <li class="nav-item">-->
                <!--                    <a class="nav-link text-light" th:href="@{/admin/technicians}" sec:authorize="hasRole('ROLE_ADMINISTRATOR')">Technician Management</a>-->
                <!--                </li>-->
                <li class="nav-item">
                    <a class="nav-link text-light" th:href="@{/sysadmin/unapproved-employees}"
                       sec:authorize="hasRole('ROLE_SUPERADMIN')">Authorization Needed</a>
                </li>
            </ul>

            <ul class="navbar-nav d-flex">
                <li class="nav-item d-flex align-items-center text-light me-3" sec:authorize="isAuthenticated()">
                    Welcome, <span sec:authentication="name" class="ms-1"></span>!
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form class="d-inline" th:action="@{/logout}" th:method="POST">
                        <button type="submit" class="btn btn-warning">Logout</button>
                    </form>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-light ms-2" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</header>

</body>
</html>
