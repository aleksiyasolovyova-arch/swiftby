<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Start Test</title>
    <script src="/js/test.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="/css/start-test.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7ff;
            color: #344a57;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            max-width: 800px;
        }
        .card {
            background-color: #aed2e3;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #5c7285;
            color: #f5f7ff;
            font-weight: bold;
            border-radius: 10px 10px 0 0;
            text-align: center;
            font-size: 1.2rem;
        }
        .btn-primary {
            background-color: #344a57;
            border-color: #344a57;
            font-size: 1rem;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #5c7285;
            border-color: #5c7285;
        }
        .status-box {
            background-color: #fada7a;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        h1 {
            color: #5c7285;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h1 class="mb-4">Start a New Test</h1>

    <form id="testForm">
        <div class="card mb-3">
            <div class="card-header">Bike Information</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="brand" class="form-label">Brand:</label>
                    <input type="text" id="brand" class="form-control" required value="Gazelle">
                </div>
                <div class="mb-3">
                    <label for="gearType" class="form-label">Gear Type:</label>
                    <input type="text" id="gearType" class="form-control" required value="Gazelle">
                </div>
                <div class="mb-3">
                    <label for="engineType" class="form-label">Engine Type:</label>
                    <input type="text" id="engineType" class="form-control" required value="engine">
                </div>
                <div class="mb-3">
                    <label for="type" class="form-label">Type:</label>
                    <input type="text" id="type" class="form-control" required value="Ultimate C380">
                </div>
                <div class="mb-3">
                    <label for="chassisNumber" class="form-label">Chassis Number:</label>
                    <input type="text" id="chassisNumber" class="form-control" required value="VG2304K5111">
                </div>
                <div class="mb-3">
                    <label for="bikeSize" class="form-label">Bike Size:</label>
                    <select id="bikeSize" class="form-select" required>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M" selected>M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="powertrain" class="form-label">Powertrain:</label>
                    <select id="powertrain" class="form-select" required>
                        <option value="CHAIN">Chain</option>
                        <option value="BELT" selected>Belt</option>
                    </select>
                </div>

            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Performance Details</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="batteryCapacity" class="form-label">Battery Capacity (Wh):</label>
                    <input type="number" id="batteryCapacity" class="form-control" required value="500">
                </div>
                <div class="mb-3">
                    <label for="maxSupport" class="form-label">Max Support (%):</label>
                    <input type="number" id="maxSupport" class="form-control" required value="340">
                </div>
                <div class="mb-3">
                    <label for="mileage" class="form-label">Mileage:</label>
                    <input type="number" id="mileage" class="form-control" required value="340">
                </div>
                <div class="mb-3">
                    <label for="enginePowerMax" class="form-label">Max Engine Power (W):</label>
                    <input type="number" id="enginePowerMax" class="form-control" required value="600">
                </div>
                <div class="mb-3">
                    <label for="enginePowerNominal" class="form-label">Nominal Engine Power (W):</label>
                    <input type="number" id="enginePowerNominal" class="form-control" required value="250">
                </div>
                <div class="mb-3">
                    <label for="engineTorque" class="form-label">Engine Torque (Nm):</label>
                    <input type="number" id="engineTorque" class="form-control" required value="85">
                </div>
            </div>
        </div>

        <!-- Test Setup -->
        <div class="card mb-3">
            <div class="card-header">Test Setup</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="testType" class="form-label">Test Type:</label>
                    <select id="testType" class="form-select">
                        <option value="STRESS" selected>Stress</option>
                        <option value="PERFORMANCE">Performance</option>
                        <option value="FAST">Fast</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="testBenchNumber" class="form-label">Test Bench Number:</label>
                    <input type="number" id="testBenchNumber" class="form-control" required value="1">
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Bike Owner Details</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="ownerEmail" class="form-label">Email:</label>
                    <input type="email" id="ownerEmail" class="form-control" required value="owner@example.com">
                </div>
                <div class="mb-3">
                    <label for="ownerFirstName" class="form-label">First Name:</label>
                    <input type="text" id="ownerFirstName" class="form-control" required value="John">
                </div>
                <div class="mb-3">
                    <label for="ownerLastName" class="form-label">Last Name:</label>
                    <input type="text" id="ownerLastName" class="form-control" required value="Doe">
                </div>
                <div class="mb-3">
                    <label for="ownerPhoneNumber" class="form-label">Phone Number:</label>
                    <input type="text" id="ownerPhoneNumber" class="form-control" required value="+1234567890">
                </div>
            </div>
        </div>

        <div class="text-center">
            <button type="button" id="startTestButton" class="btn btn-primary btn-lg px-4">Start Test</button>
        </div>

    </form>

    <div class="card mt-4">
        <div class="card-header">Test Status</div>
        <div class="card-body">
            <p id="testStatus" class="status-box">Waiting for test to start...</p>
        </div>
    </div>
</div>

</body>
</html>
