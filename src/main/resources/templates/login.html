<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BikeTrust</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #344a57;
            --secondary-color: #5c7285;
            --accent-color: #aed2e3;
            --light-bg-color: #f5f7ff;
            --cta-color: #fada7a;
        }

        body {
            background-color: var(--light-bg-color);
            color: var(--primary-color);
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-container h1 {
            font-weight: bold;
            margin-bottom: 20px;
        }

        .breadcrumb {
            background-color: var(--accent-color);
            border-radius: 5px;
            padding: 10px;
        }

        .form-control {
            border-radius: 5px;
        }

        .btn-primary {
            background-color: var(--cta-color);
            border: none;
            color: var(--primary-color);
            padding: 10px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            border-radius: 5px;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        .alert-danger {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header th:insert="~{fragments/header :: header(${currentPage})}"></header>

<main>
    <div class="login-container">

        <form th:action="@{/login}" method="POST">
            <div class="pb-3">
                <label for="username" class="form-label">Username</label>
                <input id="username" name="username" class="form-control" type="text" required>
            </div>
            <div class="pb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" class="form-control" type="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid username or password. Please try again.
        </div>
    </div>
</main>

<footer th:insert="~{fragments/footer :: footer}"></footer>

</body>
</html>
