<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bike Details</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link rel="stylesheet" href="/css/bike-details.css">
    <link rel="icon" href="/images/bicycle.svg">

</head>

<body>
<header th:insert="~{fragments/header :: header('Bike Details')}"></header>
<main class="flex-grow-1">

<div class="container py-5">

    <div class="glassmorphism p-4 mb-4">
        <h2 class="text-accent" th:text="${bike.model.brand} + ' - ' + ${bike.model.type}"></h2>
        <p><strong>Chassis Number:</strong> <span th:text="${bike.chassisNumber}"></span></p>
        <p><strong>Battery Capacity:</strong> <span th:text="${bike.model.batteryCapacity} + ' mAh'"></span></p>
        <p><strong>Max Support:</strong> <span th:text="${bike.model.maxSupport} + ' W'"></span></p>
        <p><strong>Powertrain:</strong>
            <span th:text="${bike.model.powertrain} == 0 ? 'Hub' : 'Mid-drive'"></span>
        </p>
    </div>

    <div class="glassmorphism p-4">
        <h3 class="mb-3">Test Report Summaries</h3>

        <div th:if="${summaries.isEmpty()}">
            <p class="text-muted">No report summaries available for this bikeModel yet.</p>
        </div>

        <div class="list-group" th:if="${!summaries.isEmpty()}">
            <div th:each="summary : ${summaries}" class="list-group-item glassmorphism mb-3">
                <div><strong>Date:</strong> <span th:text="${summary.reportTime}"></span></div>
                <div><strong>Technician Comment:</strong>
                    <span th:text="${summary.technicianComment} ?: 'No comment provided'"></span>
                </div>
                <a class="btn glowing-button mt-2"
                   th:href="@{/report-summary(id=${summary.id})}">
                    View Full Report
                </a>
            </div>
        </div>
    </div>

</div>
</main>

<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>
</body>
</html>
