<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Graph Visualization</title>
    <link rel="icon" href="/images/bicycle.svg">

    <!-- Vendor & project styles -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link href="/css/report-visualization.css" rel="stylesheet">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts" defer></script>
    <script src="/js/reportVIsualization.js" defer></script>

</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<!-- HEADER -->
<header th:insert="~{fragments/header :: header('graph')}"></header>

<!-- MAIN -->
<main class="flex-grow-1 container py-5 text-center">

    <h1 class="title-glow mb-5">📊 Graph Visualization</h1>

    <!-- Test Bench Chart -->
    <div class="glass-card mb-5">
        <div class="card-header">Test Bench Data Visualization</div>

        <div id="testChart" class="chart"></div>

        <!-- Field selectors -->
        <h5 class="mt-4">Select Fields to Display</h5>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 justify-content-center gy-2">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldVoltage" checked><label
                    class="form-check-label" for="fieldVoltage">Battery Voltage</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldCurrent" checked><label
                    class="form-check-label" for="fieldCurrent">Battery Current</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldPower"><label
                    class="form-check-label" for="fieldPower">Engine Power</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldTemperature"><label
                    class="form-check-label" for="fieldTemperature">Battery Temperature</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldWheelPower"><label
                    class="form-check-label" for="fieldWheelPower">Wheel Power</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldTorqueCrank"><label
                    class="form-check-label" for="fieldTorqueCrank">Torque Crank</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldRollerTorque"><label
                    class="form-check-label" for="fieldRollerTorque">Roller Torque</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldCadence"><label
                    class="form-check-label" for="fieldCadence">Cadence</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldSpeed"><label
                    class="form-check-label" for="fieldSpeed">Speed</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox"
                                           id="fieldHorizontalInclination"><label class="form-check-label"
                                                                                  for="fieldHorizontalInclination">Horizontal
                Inclination</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="fieldVerticalInclination"><label
                    class="form-check-label" for="fieldVerticalInclination">Vertical Inclination</label></div>
        </div>

        <!-- Sampling & mode -->
        <div class="row mt-4 g-3 justify-content-center">
            <div class="col-md-3">
                <label for="samplingRate" class="form-label">Sampling Interval</label>
                <select id="samplingRate" class="form-select">
                    <option value="1s">Every 1 s</option>
                    <option value="10s">Every 10 s</option>
                    <option value="1m">Every 1 m</option>
                    <option value="5m">Every 5 m</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="modeSelect" class="form-label">Value Mode</label>
                <select id="modeSelect" class="form-select">
                    <option value="raw">Raw</option>
                    <option value="normalized">Normalized</option>
                </select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button id="applySettingsBtn" class="btn btn-yellow-black w-100">Apply &amp; Update</button>
            </div>
        </div>
    </div>

    <!-- Comparison Chart -->
    <div class="glass-card mb-5">
        <div class="card-header">Compare Summary Fields Over Time</div>

        <!-- selectors -->
        <div class="row g-3 mb-4 justify-content-center">
            <div class="col-md-5">
                <label for="reportASelect" class="form-label">Select Report 1</label>
                <select id="reportASelect" class="form-select">
                    <option disabled selected>-- Choose Report 1 --</option>
                </select>
            </div>
            <div class="col-md-5">
                <label for="reportBSelect" class="form-label">Select Report 2</label>
                <select id="reportBSelect" class="form-select">
                    <option disabled selected>-- Choose Report 2 --</option>
                </select>
            </div>
        </div>

        <div class="row g-3 mb-4 justify-content-center">
            <div class="col-md-5">
                <label for="fieldNames" class="form-label">Select Field</label>
                <select id="fieldNames" class="form-select">
                    <option value="cadence">Cadence</option>
                    <option value="capacity">Battery Capacity</option>
                    <option value="current">Battery Current</option>
                    <option value="engine_power">Engine Power</option>
                    <option value="load_cell">Load Cell</option>
                    <option value="load_power">Load Power</option>
                    <option value="max_power">Max Power</option>
                    <option value="power">Wheel Power</option>
                    <option value="temperature">Temperature</option>
                    <option value="torque">Torque</option>
                    <option value="voltage">Voltage</option>
                    <option value="speed">Speed</option>
                </select>
            </div>

            <div class="col-md-3">
                <label for="samplingRateCompareFields" class="form-label">Sampling Interval</label>
                <select id="samplingRateCompareFields" class="form-select">
                    <option value="1">Every 1 s</option>
                    <option value="10">Every 10 s</option>
                    <option value="60">Every 1 m</option>
                    <option value="300">Every 5 m</option>
                </select>
            </div>

            <div class="col-md-3 d-flex align-items-end">
                <button id="compareFieldOverTimeBtn" class="btn btn-yellow-black w-100">🔍 Load Line Chart</button>
            </div>
        </div>

        <div id="summaryTimeCompareError" class="text-danger"></div>
        <div id="summaryFieldTimeChart" class="chart chart-large"></div>
    </div>

    <!-- Back -->
    <button id="backToSummaryBtn" class="btn btn-yellow-black px-4">⬅ Back to Summary</button>

</main>

<!-- FOOTER -->
<footer th:insert="~{fragments/footer :: footer}"></footer>
</body>
</html>
