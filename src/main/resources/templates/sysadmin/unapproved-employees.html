<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Unapproved Employees</title>
    <link rel="icon" href="/images/bicycle.svg">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link rel="stylesheet" href="/css/unapproved.css">
</head>
<body>
<header th:insert="~{fragments/header :: header('Unapproved Employees')}"></header>

<main class="main-content">
    <div class="container content-wrapper">
        <h1 class="text-center title-glow mb-5">Unapproved Employees</h1>

        <div class="row justify-content-center g-4">
            <div class="col-lg-6">
                <div class="glass-card p-4">
                    <h2 class="text-center mb-4">Administrators</h2>
                    <div th:if="${unapprovedAdmins.isEmpty()}">
                        <p class="text-center text-muted">No unapproved administrators.</p>
                    </div>
                    <div th:each="admin : ${unapprovedAdmins}" class="entry-box text-dark">
                        <p><strong>Name:</strong> <span th:text="${admin.firstName} + ' ' + ${admin.lastName}"></span>
                        </p>
                        <p><strong>Email:</strong> <span th:text="${admin.email}"></span></p>
                        <form th:action="@{'/sysadmin/approve-admin/' + ${admin.id}}" method="post" class="text-center">
                            <button type="submit" class="btn glowing-button">Approve</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="glass-card p-4">
                    <h2 class="text-center mb-4">Technicians</h2>
                    <div th:if="${unapprovedTechnicians.isEmpty()}">
                        <p class="text-center text-muted">No unapproved technicians.</p>
                    </div>
                    <div th:each="technician : ${unapprovedTechnicians}" class="entry-box text-dark">
                        <p><strong>Name:</strong> <span
                                th:text="${technician.firstName} + ' ' + ${technician.lastName}"></span></p>
                        <p><strong>Email:</strong> <span th:text="${technician.email}"></span></p>
                        <form th:action="@{'/sysadmin/approve-technician/' + ${technician.id}}" method="post"
                              class="text-center">
                            <button type="submit" class="btn glowing-button">Approve</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
            <a href="/" class="btn glowing-button">⬅ Back to Dashboard</a>
        </div>
    </div>
</main>

<footer th:insert="~{fragments/footer :: footer}" class="footer"></footer>
</body>
</html>
