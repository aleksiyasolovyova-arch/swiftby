<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Set Your Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet"> <!-- Your glassmorphism + glowing styles -->
</head>
<body>
<header th:insert="~{fragments/header :: header('Set Your Password')}"></header>

<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="glass-card p-5 w-100" style="max-width: 500px;">
        <h1 class="text-center mb-4 title-glow">Set Your Password</h1>
        <form action="/api/auth/set-password" method="post">
            <input type="hidden" name="token" th:value="${token}" />

            <div class="mb-3">
                <input type="password" name="password" class="form-control fancy-input" placeholder="Enter new password" required />
            </div>

            <button type="submit" class="btn glowing-button w-100">Set Password</button>
        </form>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>
</body>
</html>
