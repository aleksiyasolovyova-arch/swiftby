<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://canvasjs.com/assets/script/canvasjs.min.js"></script>
    <script defer src="/js/dashboard.js"></script>
    <link rel="stylesheet" href="/css/technician-dashboard.css">

    <meta charset="UTF-8">
    <title>Technician's Dashboard</title>

</head>

<body>

<div class="container-fluid">
    <div class="row mb-4 text-center">
        <div class="col-md-3">
            <button type="button" class="btn btn-outline-dark w-100">Start New Test</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-outline-dark w-100">Insert RAW Data</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-outline-dark w-100">4/6 Tests Active</button>
        </div>
        <div class="col-md-3">
            <button type="button" class="btn btn-success w-100">Bench Status: Optimal</button>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-9" id="image" style="position: relative;">
            <img src="/images/Bike.JPG" alt="Bike" style="width: 100%; height: auto; border-radius: 8px;">
            <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"
                 xmlns="http://www.w3.org/2000/svg">
                <circle cx="65%" cy="30%" r="10" fill="red"/>
                <circle cx="40%" cy="60%" r="10" fill="yellow"/>
                <circle cx="30%" cy="80%" r="10" fill="red"/>
            </svg>
        </div>

        <div class="col-md-3">
            <div class="row justify-content-center">
                <div class="col-md-3 progress-container">
                    <canvas id="progressCanvas" width="200" height="200">

                    </canvas>

                    <div class="progress-text">
                        <i class="bi bi-bicycle progress-icon"></i><br>
                        <span id="testsDone">4 / 11</span>
                    </div>

                    <div class="progress-details">
                        <span id="progressPercentage">45% Progress</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6 mx-auto center border rounded p-4 shadow-sm" id="chartContainer">
        </div>

        <div class="col-md-6 mx-auto text-center border rounded p-4 shadow-sm">
            <h3 class="mb-4 text-primary">Pre-Test Checklist</h3>
            <ul class="list-unstyled">
                <li class="d-flex align-items-center mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheck1">
                        <label class="form-check-label" for="flexSwitchCheck1">Roller Torque Sufficient</label>
                    </div>
                </li>
                <li class="d-flex align-items-center mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheck2">
                        <label class="form-check-label" for="flexSwitchCheck2">Belt Connection</label>
                    </div>
                </li>
                <li class="d-flex align-items-center mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheck3">
                        <label class="form-check-label" for="flexSwitchCheck3">Network Connected</label>
                    </div>
                </li>
                <li class="d-flex align-items-center mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheck4">
                        <label class="form-check-label" for="flexSwitchCheck4">Wheels Secured</label>
                    </div>
                </li>
                <li class="d-flex align-items-center mb-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="flexSwitchCheck5">
                        <label class="form-check-label" for="flexSwitchCheck5">Tire Pressure Optimal</label>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
