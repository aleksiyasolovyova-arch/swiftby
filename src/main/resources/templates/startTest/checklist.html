<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find or Add User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/checklist.css}">
    <script src="/js/checklist.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">


<header th:insert="~{fragments/header :: header(${currentPage})}" class="mb-4"></header>

<main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="glassmorphism text-center p-4">
            <div id="userForm" class="mt-4">
                <h2 class="text-secondary text-center">PRE-TEST CHECKLIST</h2>
                <div class="p-4 border rounded bg-light">
                    <div class="form-check">
                        <input type="checkbox" id="rollerTorque" class="form-check-input">
                        <label for="rollerTorque" class="form-check-label">Roller Torque Sufficient</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="beltConnection" class="form-check-input">
                        <label for="beltConnection" class="form-check-label">Belt Connection</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="networkConnected" class="form-check-input">
                        <label for="networkConnected" class="form-check-label">Network Connected</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="wheelSecured" class="form-check-input">
                        <label for="wheelSecured" class="form-check-label">Wheels Secured</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" id="tirePressureOptimal" class="form-check-input">
                        <label for="tirePressureOptimal" class="form-check-label">Tire Pressure Optimal</label>
                    </div>
                    <a href="/startTest/find-user">
                        <button id="checklist" class="btn btn-primary mt-3 w-100" disabled>Next</button>

                    </a>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>

</body>
</html>
