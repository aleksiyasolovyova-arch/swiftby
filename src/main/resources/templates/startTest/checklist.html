<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pre-Test Checklist</title>
    <link rel="icon" href="/images/bicycle.svg">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link rel="stylesheet" href="/css/checklist.css">
    <script defer src="/js/checklist.js"></script>
</head>
<body>
<header th:insert="~{fragments/header :: header(${currentPage})}"></header>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="glassmorphism w-100" style="max-width: 700px;">
        <h2 class="text-center text-accent mb-4"> Pre-Test Checklist</h2>

        <ul class="list-unstyled  p-3 rounded">
            <li class="form-check form-switch mb-3">
                <input class="form-check-input checklist-switch" type="checkbox" id="check1">
                <label class="form-check-label" for="check1">Roller Torque Sufficient</label>
            </li>
            <li class="form-check form-switch mb-3">
                <input class="form-check-input checklist-switch" type="checkbox" id="check2">
                <label class="form-check-label" for="check2">Belt Connection</label>
            </li>
            <li class="form-check form-switch mb-3">
                <input class="form-check-input checklist-switch" type="checkbox" id="check3">
                <label class="form-check-label" for="check3">Network Connected</label>
            </li>
            <li class="form-check form-switch mb-3">
                <input class="form-check-input checklist-switch" type="checkbox" id="check4">
                <label class="form-check-label" for="check4">Wheels Secured</label>
            </li>
            <li class="form-check form-switch mb-3">
                <input class="form-check-input checklist-switch" type="checkbox" id="check5">
                <label class="form-check-label" for="check5">Tire Pressure Optimal</label>
            </li>
        </ul>

        <div class="text-center mt-4">
            <button id="proceedButton" class="btn glowing-button w-100" disabled>
                Proceed to Starting the Test
            </button>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>
</body>
</html>
