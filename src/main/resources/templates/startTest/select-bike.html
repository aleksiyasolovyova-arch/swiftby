<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Bike</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/select-bike.js" defer></script>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="glassmorphism text-center p-4 w-100">
        <h1 class="text-accent">🚴 Select a Bike</h1>
        <div id="bikeList" class="my-3"></div>
        <button id="selectBike" class="btn glowing-button w-100" disabled>Proceed for the selected bike</button>

        <div id="newBikeForm" class="mt-4 hidden">
            <h2 class="text-secondary"> Add a New Bike</h2>
            <div class="row">
                <div class="col-md-6">
                    <input type="text" id="brand" class="form-control fancy-input my-2" placeholder="Brand" required>
                    <input type="text" id="type" class="form-control fancy-input my-2" placeholder="Type" required>
                    <input type="text" id="chassisNumber" class="form-control fancy-input my-2" placeholder="Chassis Number" required>

                    <label for="powertrain" class="form-label">Powertrain:</label>
                    <select id="powertrain" class="form-control fancy-input my-2">
                        <option value="" disabled selected>Loading powertrains...</option>
                    </select>

                    <label for="bikeSize" class="form-label">Bike Size:</label>
                    <select id="bikeSize" class="form-control fancy-input my-2">
                        <option value="" disabled selected>Loading sizes...</option>
                    </select>


                    <label for="maxSupport" class="form-label">Max Support (%)</label>
                    <input type="number" id="maxSupport" class="form-control fancy-input my-2" value="100" min="0" max="100" required>
                    <label for="batteryCapacity" class="form-label">Battery Capacity (Wh)</label>
                    <input type="number" id="batteryCapacity" class="form-control fancy-input my-2" value="500" required>
                </div>

                <div class="col-md-6">
                    <h3 class="text-secondary"> Motor Details</h3>
                    <label for="engineType" class="form-label">Engine Type:</label>
                    <input type="text" id="engineType" class="form-control fancy-input my-2" placeholder="Engine type" required>
                    <label for="gearType" class="form-label">Gear Type:</label>
                    <input type="text" id="gearType" class="form-control fancy-input my-2" placeholder="Gear type" required>

                    <label for="maxPower" class="form-label">Max Power (W)</label>
                    <input type="number" id="maxPower" class="form-control fancy-input my-2" value="500" required>

                    <label for="nominalPower" class="form-label">Nominal Power (W)</label>
                    <input type="number" id="nominalPower" class="form-control fancy-input my-2" value="250" required>

                    <label for="torque" class="form-label">Torque (Nm)</label>
                    <input type="number" id="torque" class="form-control fancy-input my-2" value="75" required>


                </div>
            </div>

            <button id="saveBikeButton" class="btn glowing-button w-100 mt-3">💾 Save Bike</button>
        </div>
    </div>
</div>

</body>
</html>
