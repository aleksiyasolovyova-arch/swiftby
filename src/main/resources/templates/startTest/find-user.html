<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find or Add User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="/js/find-user.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

<header th:insert="~{fragments/header :: header(${currentPage})}" class="mb-4"></header>

<main class="container d-flex flex-column justify-content-center align-items-center flex-grow-1">
    <div class="container d-flex justify-content-center align-items-center">
        <div class="glassmorphism text-center p-4">
            <h1 class="text-accent"> Find User</h1>
            <div class="input-container">
                <input type="email" id="customerEmail" class="form-control fancy-input my-3" placeholder="Enter user email"
                       required>
                <div id="search-output" hidden></div>
            </div>


            <!--    <button id="findUserButton" class="btn fancy-button w-100">Find User</button>-->

            <hr class="m-3">
            <h3>Or</h3>
            <hr class="m-3">

            <div id="userForm" class="mt-4 hidden">
                <h2 class="text-secondary">➕ Add New User</h2>
                <input type="text" id="email" class="form-control fancy-input my-2" placeholder="email" required>
                <input type="text" id="firstName" class="form-control fancy-input my-2" placeholder="First Name" required>
                <input type="text" id="lastName" class="form-control fancy-input my-2" placeholder="Last Name" required>
                <input type="text" id="phoneNumber" class="form-control fancy-input my-2" placeholder="Phone Number"
                       required>
                <button id="saveUserButton" class="btn glowing-button w-100">Save User</button>
            </div>
        </div>
    </div>
</main>


<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>


</body>
</html>
