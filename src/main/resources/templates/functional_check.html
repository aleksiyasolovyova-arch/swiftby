<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Functional Check</title>
  <script src="/js/functional_check.js" type="module" defer></script>
</head>
<body>
<div class="container py-5">
  <div class="glass-card">
    <h1 class="title-glow">Functional Check</h1>

    <form id="functionalCheckForm">
      <div class="form-group mb-3">
        <label for="lightsStatus">Lights Status:</label>
        <select id="lightsStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label for="brakesStatus">Brakes Status:</label>
        <select id="brakesStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label for="displayStatus">Display Status:</label>
        <select id="displayStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label for="hornStatus">Horn Status:</label>
        <select id="hornStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label for="motorStatus">Motor Status:</label>
        <select id="motorStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <div class="form-group mb-3">
        <label for="batteryStatus">Battery Status:</label>
        <select id="batteryStatus" class="form-control">
          <option value="">Select</option>
          <option value="+">Working (+)</option>
          <option value="-">Broken (-)</option>
          <option value="nvt">Not Applicable (n.v.t)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100">Save Functional Check</button>
    </form>

    <div id="functionalCheckStatus" class="mt-3"></div>
  </div>
</div>
</body>
</html>
