<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Functional Check</title>
    <link rel="icon" href="/images/bicycle.svg">

    <script src="/js/functional_check.js" type="module" defer></script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link href="/css/bike-report-summary.css" rel="stylesheet">
</head>
<body>
<header th:insert="~{fragments/header :: header(${currentPage})}"></header>

<div class="container py-5">
    <div class="summary-container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="glass-card">
                    <h1 class="title-glow text-center mb-4">Functional Check</h1>

                    <form id="functionalCheckForm">
                        <div class="form-group mb-3">
                            <label for="lightsStatus">Lights Status:</label>
                            <select id="lightsStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="brakesStatus">Brakes Status:</label>
                            <select id="brakesStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="displayStatus">Display Status:</label>
                            <select id="displayStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="hornStatus">Horn Status:</label>
                            <select id="hornStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <div class="form-group mb-3">
                            <label for="motorStatus">Motor Status:</label>
                            <select id="motorStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <div class="form-group mb-4">
                            <label for="batteryStatus">Battery Status:</label>
                            <select id="batteryStatus" class="form-select">
                                <option value="">Select</option>
                                <option value="+">Working (+)</option>
                                <option value="-">Broken (-)</option>
                                <option value="nvt">Not Applicable (n.v.t)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn glowing-button w-100">Save Functional Check</button>
                    </form>

                    <div id="functionalCheckStatus" class="mt-4 text-center"></div>
                </div>

                <div class="text-center mt-4">
                    <button class="btn glowing-button" onclick="window.history.back()">⬅ Go Back</button>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{fragments/footer :: footer}" class="mt-4"></footer>
</body>
</html>
