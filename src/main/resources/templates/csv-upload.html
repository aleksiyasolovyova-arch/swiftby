<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css} ">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>
    <script src="/js/csv/csv-handling.js" defer></script>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="icon" href="/images/bicycle.svg">

</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h2><i class="bi bi-file-earmark-spreadsheet"></i> CSV Reader & Uploader</h2>
        </div>
        <div class="card-body">
            <!-- File Upload Form -->
            <form onsubmit="uploadFile(event)" class="mb-4">
                <div class="input-group">
                    <input type="file" class="form-control" id="csv" name="csv">
                    <button type="submit" class="btn btn-success">Upload</button>
                </div>
            </form>

            <!-- Show CSV Button -->
            <button id="showCsvButton" class="btn btn-primary w-100">
                <i class="bi bi-eye"></i> Show CSV Data
            </button>

            <!-- Table to Display CSV Data -->
            <div class="table-responsive mt-4">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                    <tr id="csvHeaderRow"></tr>
                    </thead>
                    <tbody id="csvTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
