<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Reader</title>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}"/>

    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.js}"></script>

    <!-- Custom JavaScript -->
</head>
<body>

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
            <h2><i class="bi bi-file-earmark-spreadsheet"></i> CSV Reader</h2>
        </div>
        <div class="card-body">
            <!-- File Input -->
            <div class="mb-3">
                <label for="fileNameInput" class="form-label">Enter CSV File Name:</label>
                <input type="text" class="form-control" id="fileNameInput" placeholder="Enter CSV filename (e.g., data.csv)">
            </div>

            <!-- Show CSV Button -->
            <button id="showCsvButton" class="btn btn-primary w-100">
                <i class="bi bi-eye"></i> Show CSV Data
            </button>

            <!-- Table to Display CSV Data -->
            <div class="table-responsive mt-4">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                    <tr id="csvHeaderRow"></tr>
                    </thead>
                    <tbody id="csvTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
